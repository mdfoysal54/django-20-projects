{% extends "base.html" %}
{% block title %}Audit log{% endblock %}
{% block content %}
<div class="page-head"><h1>Audit log</h1></div>
<div class="table-wrap"><table class="tbl">
  <thead><tr><th>When</th><th>Who</th><th>Verb</th><th>Object</th><th>Detail</th></tr></thead>
  <tbody>{% for a in page %}
    <tr>
      <td class="small">{{ a.at }}</td>
      <td>{{ a.user|default:"—" }}</td>
      <td class="mono">{{ a.verb }}</td>
      <td>{{ a.model }} {{ a.object_id }}</td>
      <td>{{ a.detail }}</td>
    </tr>
  {% empty %}<tr><td colspan="5">Quiet so far.</td></tr>{% endfor %}
  </tbody>
</table></div>
{% endblock %}
