{% extends "base.html" %}
{% block title %}Staff{% endblock %}
{% block content %}

<div class="page-head"><h1>Staff</h1></div>
<div class="table-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Name</th><th>Designation</th></tr></thead>
<tbody>{% for r in rows %}<tr><td>{{ r.code }}</td><td>{{ r }}</td><td>{{ r.designation }}</td></tr>{% empty %}<tr><td colspan="3">No staff.</td></tr>{% endfor %}</tbody></table></div>

{% endblock %}
