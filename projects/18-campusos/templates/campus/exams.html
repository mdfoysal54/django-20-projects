{% extends "base.html" %}
{% block title %}Exams{% endblock %}
{% block content %}

<div class="grid grid-2"><div class="card"><form method="post">{% csrf_token %}
  {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
  <button class="btn btn-primary" type="submit">Save exam</button></form></div>
  <div class="card">{% for r in rows %}<div class="cart-row"><a href="{{ r.get_absolute_url }}">{{ r.name }}</a><span>{{ r.held_on }}</span></div>{% endfor %}</div></div>

{% endblock %}
