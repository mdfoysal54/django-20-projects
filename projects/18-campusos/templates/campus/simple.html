{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div class="page-head"><h1>{{ title }}</h1></div>
<div class="grid grid-2"><div class="card"><form method="post">{% csrf_token %}
  {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
  <button class="btn btn-primary" type="submit">Save</button></form></div>
  <div class="card">{% for r in rows %}<div class="cart-row"><span>{{ r }}</span></div>{% endfor %}</div></div>

{% endblock %}
