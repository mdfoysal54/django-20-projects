{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}

<div class="card"><form method="post">{% csrf_token %}
  <div class="form-group"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ company.name }}"></div>
  <div class="form-group"><label class="form-label">Theme</label><select name="theme" class="form-control"><option>violet</option><option>void</option></select></div>
  <div class="form-group"><label class="form-label">Language</label><select name="language" class="form-control"><option>en</option><option>bn</option></select></div>
  <button class="btn btn-primary" type="submit">Save</button></form></div>

{% endblock %}
