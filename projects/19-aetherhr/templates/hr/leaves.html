{% extends "base.html" %}
{% block title %}Leave{% endblock %}
{% block content %}

<div class="page-head"><h1>Leave</h1><a class="btn btn-primary" href="{% url 'leave_new' %}">Request</a></div>
<div class="table-wrap"><table class="tbl"><thead><tr><th>Who</th><th>Kind</th><th>From</th><th>To</th><th></th></tr></thead>
<tbody>{% for r in rows %}<tr><td><a href="{{ r.get_absolute_url }}">{{ r.employee }}</a></td><td>{{ r.kind }}</td><td>{{ r.starts_on }}</td><td>{{ r.ends_on }}</td><td>{{ r.get_status_display }}</td></tr>{% endfor %}</tbody></table></div>

{% endblock %}
