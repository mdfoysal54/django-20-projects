{% extends "base.html" %}
{% block title %}News{% endblock %}
{% block content %}

<div class="grid grid-2"><div class="card"><form method="post">{% csrf_token %}
  <input class="form-control" name="title" placeholder="Title">
  <textarea class="form-control mt-1" name="body"></textarea>
  <button class="btn btn-primary mt-1" type="submit">Publish</button></form></div>
  <div class="card">{% for r in rows %}<div class="mb-2"><h3>{{ r.title }}</h3><p>{{ r.body }}</p></div>{% endfor %}</div></div>

{% endblock %}
